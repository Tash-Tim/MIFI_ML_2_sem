version: "3.9"

services:
  ml-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: credit-card-ml-service
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  nginx-demo:
    image: nginx:alpine
    container_name: nginx-demo
    ports:
      - "8080:80"
    restart: unless-stopped